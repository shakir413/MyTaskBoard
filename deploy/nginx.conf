# Put at /etc/nginx/conf.d/taskboard.conf on the EC2 server.
# Nginx listens on port 80 and passes requests to Node (port 5000).
# Analogy: Nginx is the hotel receptionist; Node is the staff in the back.
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
